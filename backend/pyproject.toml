[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[project]
name = "cloud-cost-intelligence-backend"
version = "1.0.0"
description = "AWS Cloud Cost Intelligence and FinOps Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FinOps Engineering Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "boto3>=1.34.0",
    "jinja2>=3.1.3",
    "tabulate>=0.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "xhtml2pdf>=0.2.11",
    "psycopg2-binary>=2.9.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

