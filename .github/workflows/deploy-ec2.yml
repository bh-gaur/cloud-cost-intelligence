name: Deploy Cloud Cost Intelligence to EC2

# ─────────────────────────────────────────────────────────────────────────────
#  Cloud Cost Intelligence CI/CD Deployment Workflow
#  Flow:
#    1. backend-test   — pytest unit & integration tests
#    2. frontend-build — tsc type check + Vite build verification
#    3. docker-push    — Build & push container images to GHCR (ghcr.io)
#    4. deploy         — SSH into EC2, pull latest images, zero-downtime restart & healthcheck
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
# ══════════════════════════════════════════════════════════════
# JOB 1 — Backend Tests
# ══════════════════════════════════════════════════════════════
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install ".[dev]"

      - name: Run pytest suite
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DEMO_MODE: "true"
          SECRET_KEY: ci-test-secret-key-not-real
        run: |
          pytest tests/ -v --tb=short

# ══════════════════════════════════════════════════════════════
# JOB 2 — Frontend Build
# ══════════════════════════════════════════════════════════════
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compile & Build
        working-directory: frontend
        run: npm run build

# ══════════════════════════════════════════════════════════════
# JOB 3 — Build Docker Images & Push to GHCR
# ══════════════════════════════════════════════════════════════
  docker-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend Image ───────────────────────────────────────
      - name: Build & Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloud-cost-intelligence-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cloud-cost-intelligence-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64

      # ── Frontend Image ──────────────────────────────────────
      - name: Build & Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloud-cost-intelligence-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cloud-cost-intelligence-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

